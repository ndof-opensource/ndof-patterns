# Publishes this library's Conan recipe to the public ndof remote when a
# version tag (v0.1.0) is pushed. All logic lives in the reusable workflow
# in ndof-infra; see ndof-infra/docs/releasing.md for the specific procedure.
# This workflow-ref SHA is bumped by hand (Dependabot cannot track a
# tagless repo).
name: Publish
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    uses: ndof-opensource/ndof-infra/.github/workflows/publish.yml@5c1db2459317c4a1b2fd209297c02d27c3d18719 # main 2026-10-09
    secrets:
      CLOUDSMITH_USER: ${{ secrets.CLOUDSMITH_USER }}
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
